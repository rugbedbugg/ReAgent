[tools]
python = "{{ env.REAGENT_PYTHON_VERSION | default(value='3.11') }}"
uv = "latest"

[settings]
python.uv_venv_auto = true

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install the package and dev extras into the project venv"
run = 'uv pip install -e ".[dev]"'

[tasks.test]
description = "Run the test suite"
run = "pytest"

[tasks.lint]
description = "Run Ruff over the project"
run = "ruff check ."

[tasks.build]
description = "Build wheel and source distribution"
run = "uv build"

[tasks.check-dist]
description = "Check distribution metadata"
run = "uvx twine check dist/*"

[tasks.prepare-packages]
description = "Prepare package channels from a published release (pass --tag vX.Y.Z)"
run = "uv run --no-project --python 3.11 scripts/packaging/prepare.py"

[tasks.test-packaging]
description = "Test channel generation and installer checksums"
run = "uv run --no-project --python 3.11 -m unittest discover -s scripts/packaging -p test_*.py"
