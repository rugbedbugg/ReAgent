[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reagent"
version = "0.2.0"
description = "Agentic, evidence-grounded framework for automated retrosynthetic planning"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "rdkit>=2023.9",
    "aizynthfinder>=4.4",
    "anthropic>=0.117",
    "pymoo>=0.6",
    "pydantic>=2.0",
    "click>=8.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
reagent = "reagent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reagent*"]

[tool.ruff]
line-length = 100
# Lowest supported interpreter, so lint never suggests syntax that breaks 3.10.
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: Ruff's default rule set changes between releases, which
# silently changes what CI enforces.
# E501 (line-too-long) is deliberately absent: 16 lines currently run 101-110
# chars. Add "E5" once those are wrapped to enforce the 100-char limit.
select = ["E4", "E7", "E9", "F", "I", "UP"]
