name: Release

# Tags are the trigger, and the tag is checked against the version in
# pyproject.toml before anything is built. A release whose artifact reports a
# different version than its tag is worse than no release at all.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Trust project config
        run: mise trust

      - name: Install package and dev extras
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

  build:
    name: build and attach artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Trust project config
        run: mise trust

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
          echo "tag and version agree: $version"

      - name: Build sdist and wheel
        run: |
          uv pip install --system build
          python -m build

      - name: Check the artifacts are well formed
        run: |
          uv pip install --system twine
          twine check dist/*

      - name: Publish the release with its artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true
