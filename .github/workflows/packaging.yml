name: Packaging

# The Chocolatey package was written without a Windows machine to test it on.
# This is that machine. It is not part of CI because a full install pulls RDKit,
# ONNX Runtime and 200-odd other wheels, which is slow and pointless to repeat
# on every push. It runs when the packaging actually changes, and on demand.
on:
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: "Submit author/icon corrections for the three existing packages"
        type: boolean
        default: false
      publish:
        description: "Also push to the Chocolatey community feed (public, irreversible)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "SUBMISSIONS/**"
      - ".github/workflows/packaging.yml"
  push:
    branches: [main]
    paths:
      - "SUBMISSIONS/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chocolatey:
    name: chocolatey install
    if: ${{ !inputs.refresh_metadata }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack
        working-directory: SUBMISSIONS/chocolatey
        run: choco pack

      # Both sources: the local folder holds reagent.nupkg, the community feed
      # holds the python311 dependency. "-s ." alone cannot resolve the latter.
      - name: Install from the local package
        working-directory: SUBMISSIONS/chocolatey
        run: choco install reagent -s ".;https://community.chocolatey.org/api/v2/" -y --no-progress

      - name: The shims work
        run: |
          reagent --help
          reagent plan --help
          reagent-download-data --help

      - name: The installed launcher finds user data
        shell: pwsh
        run: |
          # No models need downloading: a missing stock error must name the
          # selected user directory, not the installed site-packages directory.
          $ErrorActionPreference = 'Continue'
          Remove-Item Env:REAGENT_DATA -ErrorAction SilentlyContinue
          $expected = Join-Path $env:LOCALAPPDATA 'reagent'
          $output = reagent build-stock-cache 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or -not $output.Contains($expected)) {
            throw "Default data discovery failed: $output"
          }
          $env:REAGENT_DATA = Join-Path $env:RUNNER_TEMP 'custom reagent data'
          $output = reagent build-stock-cache 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or -not $output.Contains($env:REAGENT_DATA)) {
            throw "Explicit data override failed: $output"
          }
          Remove-Item Env:REAGENT_DATA
          exit 0

      - name: Uninstall cleanly
        run: choco uninstall reagent -y

      - name: Preserve the tested package
        uses: actions/upload-artifact@v4
        with:
          name: reagent-chocolatey
          path: SUBMISSIONS/chocolatey/reagent.*.nupkg
          if-no-files-found: error

  aur:
    name: aur pkgbuild
    if: ${{ !inputs.refresh_metadata }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: pacman -Sy --noconfirm namcap git

      # makepkg refuses to run as root, and the container is root.
      - name: Create a build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Lint the PKGBUILD
        working-directory: SUBMISSIONS/aur
        run: su builder -c "namcap PKGBUILD"

      # A full build downloads a 1.3 GB dependency tree, so this checks the
      # metadata is well-formed and .SRCINFO agrees with the PKGBUILD, which is
      # what the AUR itself rejects a push for.
      - name: .SRCINFO matches PKGBUILD
        working-directory: SUBMISSIONS/aur
        run: |
          su builder -c "makepkg --printsrcinfo" > .SRCINFO.generated
          diff .SRCINFO .SRCINFO.generated

      - name: Source checksums resolve
        working-directory: SUBMISSIONS/aur
        run: su builder -c "makepkg --verifysource --skippgpcheck"

  # Publishing needs a Windows runner (choco is Windows-only) and an API key
  # that only the maintainer holds. Manual by design: a push to the community
  # feed is public and cannot be undone, so it does not ride on a tag.
  publish-chocolatey:
    name: publish to the chocolatey community feed
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: chocolatey
    environment: chocolatey
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reagent-chocolatey
          path: package

      - name: Refuse to publish without a key
        shell: pwsh
        run: |
          if (-not "${{ secrets.CHOCOLATEY_API_KEY }}") {
            throw "CHOCOLATEY_API_KEY is not set. Add it as a repository secret."
          }

      - name: Push
        working-directory: package
        shell: pwsh
        run: |
          choco apikey --key "${{ secrets.CHOCOLATEY_API_KEY }}" --source https://push.chocolatey.org/
          $pkg = Get-ChildItem -Filter "reagent.*.nupkg" | Select-Object -First 1
          Write-Host "Pushing $($pkg.Name)"
          choco push $pkg.FullName --source https://push.chocolatey.org/

  refresh-metadata:
    name: Verify and submit package metadata corrections
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_metadata
    runs-on: windows-latest
    environment: chocolatey
    steps:
      - uses: actions/checkout@v4
        with:
          path: reagent
      - uses: actions/checkout@v4
        with:
          repository: rugbedbugg/ResonanceID-cli
          ref: 91a4522399a153adfeaf5fd3419f8c6d4423afec
          path: resonanceid-cli
      - uses: actions/checkout@v4
        with:
          repository: rugbedbugg/Retro-Tetris
          ref: b05f4c0635cab61b000bb04b90184e6e9ea3b184
          path: retro-tetris
      - name: Check key availability
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if (-not $env:CHOCOLATEY_API_KEY) { throw 'CHOCOLATEY_API_KEY is missing' }
      - name: Verify unchanged installers, metadata, and CDN icons; pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @('reagent', 'resonanceid-cli', 'retro-tetris')) {
            $version = if ($id -eq 'reagent') { '0.2.0' } else { '1.0.0' }
            $expectedVersion = if ($id -eq 'reagent') { '0.2.0' } else { '1.0.0.20260907' }
            $source = Join-Path $PWD "$id/SUBMISSIONS/chocolatey"
            $archive = Join-Path $env:RUNNER_TEMP "$id.zip"
            $original = Join-Path $env:RUNNER_TEMP "$id-original"
            Invoke-WebRequest "https://community.chocolatey.org/api/v2/package/$id/$version" -OutFile $archive
            Expand-Archive $archive $original
            $oldTools = Join-Path $original 'tools'
            $newTools = Join-Path $source 'tools'
            $oldFiles = @(Get-ChildItem $oldTools -File -Recurse)
            $newFiles = @(Get-ChildItem $newTools -File -Recurse)
            if ($oldFiles.Count -ne $newFiles.Count) { throw "$id installer file count changed" }
            foreach ($file in $oldFiles) {
              $relative = [IO.Path]::GetRelativePath($oldTools, $file.FullName)
              $newFile = Join-Path $newTools $relative
              if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $newFile).Hash) {
                throw "$id installer changed: $relative"
              }
            }
            [xml]$nuspec = Get-Content (Join-Path $source "$id.nuspec") -Raw
            $metadata = $nuspec.package.metadata
            if ($metadata.authors -ne 'Partha Pratim Gogoi' -or $metadata.owners -ne 'rugbedbugg' -or $metadata.version -ne $expectedVersion) {
              throw "$id metadata mismatch"
            }
            if ($metadata.iconUrl -notmatch '^https://cdn.jsdelivr.net/gh/rugbedbugg/[^@]+@[0-9a-f]{40}/assets/icon.png$') {
              throw "$id icon is not pinned to a commit on the CDN"
            }
            $icon = Join-Path $env:RUNNER_TEMP "$id.png"
            Invoke-WebRequest $metadata.iconUrl -OutFile $icon
            if ((Get-FileHash $icon).Hash -ne (Get-FileHash "$id/assets/icon.png").Hash) {
              throw "$id CDN icon does not match committed icon"
            }
            Push-Location $source
            choco pack
            if ($LASTEXITCODE -ne 0) { throw "$id pack failed" }
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: chocolatey-metadata-corrections
          path: '**/SUBMISSIONS/chocolatey/*.nupkg'
          if-no-files-found: error
      - name: Submit corrected packages
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          choco apikey --key $env:CHOCOLATEY_API_KEY --source https://push.chocolatey.org/
          if ($LASTEXITCODE -ne 0) { throw 'Setting Chocolatey API key failed' }
          foreach ($id in @('resonanceid-cli', 'retro-tetris', 'reagent')) {
            $pkg = Get-ChildItem "$id/SUBMISSIONS/chocolatey/*.nupkg" | Select-Object -First 1
            choco push $pkg.FullName --source https://push.chocolatey.org/
            if ($LASTEXITCODE -ne 0) { throw "$id push failed" }
          }
