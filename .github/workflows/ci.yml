name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Trust project config
        run: mise trust

      - name: Install package and dev extras
        run: mise run install

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

  # The Chocolatey package installs on Windows, and until now nothing had ever
  # run this code there. mise is deliberately not used: setup-python is the
  # better-trodden path on Windows runners, and this job is about the package,
  # not the toolchain.
  test-windows:
    name: test (windows, python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev extras
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: The CLI actually starts
        run: |
          reagent --help
          reagent plan --help
