name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11']
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Locate uv cache
        id: uv-cache
        shell: bash
        run: echo "dir=$(mise exec -- uv cache dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.uv-cache.outputs.dir }}
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install package and dev extras
        run: mise run install
      - name: Lint
        run: mise run lint
      - name: Test
        run: mise run test
      - name: CLI smoke test
        run: mise exec -- reagent --help

  distributions:
    name: Validate distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run install
      - run: mise run build
      - run: mise run check-dist
      - name: Test the source distribution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          cd "$RUNNER_TEMP/sdist"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q
      - name: Smoke-test the built wheel in an isolated environment
        shell: bash
        run: |
          mise exec -- uv venv "$RUNNER_TEMP/wheel-env" --python 3.11
          mise exec -- uv pip install --python "$RUNNER_TEMP/wheel-env/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/reagent" --help
      - name: Record artifact checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
